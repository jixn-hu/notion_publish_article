# MoFlow WeChat API relay for an SSH tunnel.
# Install as /etc/nginx/sites-available/moflow-wechat-relay and enable it.
server {
    listen 127.0.0.1:18080;
    server_name _;

    client_max_body_size 50m;

    # WeChat request query strings contain AppSecret and access_token values.
    access_log off;
    error_log /var/log/nginx/moflow-wechat-relay-error.log crit;

    location = /health {
        default_type application/json;
        return 200 '{"status":"ok"}';
    }

    location /wechat/ {
        allow 127.0.0.1;
        deny all;

        limit_except GET POST {
            deny all;
        }

        # The trailing slashes remove /wechat/ before forwarding.
        proxy_pass https://api.weixin.qq.com/;
        proxy_http_version 1.1;

        proxy_ssl_server_name on;
        proxy_ssl_name api.weixin.qq.com;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;

        proxy_set_header Host api.weixin.qq.com;
        proxy_set_header Authorization "";
        proxy_set_header X-Real-IP "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header Connection "";

        proxy_request_buffering off;
        proxy_connect_timeout 15s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }
}
