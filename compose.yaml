name: mozhou-publisher

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mozhou-publisher:latest
    container_name: mozhou-publisher
    restart: unless-stopped
    init: true
    environment:
      # 开发阶段保留详细日志；上线后可改为 INFO 或 WARNING。
      LOG_LEVEL: ${LOG_LEVEL:-DEBUG}
      LOG_FILE: /app/data/backend.log
    ports:
      # 当前没有用户登录系统，默认只允许宿主机访问。
      - "127.0.0.1:${APP_PORT:-8000}:8000"
    volumes:
      - mozhou-data:/app/data
      # 首次启动时可从当前项目 data 目录导入旧数据库；不会覆盖卷内数据库。
      - ./data:/app/import:ro
    extra_hosts:
      # 容器访问宿主机代理时使用 host.docker.internal，而不是 127.0.0.1。
      - "host.docker.internal:host-gateway"
    read_only: true
    tmpfs:
      - /tmp:size=128m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    stop_grace_period: 20s
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
          'http://127.0.0.1:8000/api/health', timeout=3).read()
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  mozhou-data:
    name: mozhou-publisher-data
